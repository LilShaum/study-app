name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # NOTE: deliberately no workflow_dispatch. This workflow publishes to the
  # live GitHub Pages site, and a manual run from the Actions tab lets you pick
  # any branch — so dispatching from a feature branch would quietly overwrite
  # production with unmerged work. Deploys happen by merging to main.

# Grant the GITHUB_TOKEN the permissions required by the Pages actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs so a
# deploy already in flight can finish before a new one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom's undici calls webidl.util.markAsUncloneable,
          # which the runner's Node 20 does not have, so `npm test` dies with
          # "is not a function" before a single test runs. This only surfaced
          # once the test step was added to this workflow — the build itself
          # is fine on 20, which is why it went unnoticed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the test suite. `npm run build` runs `tsc -b`, so
      # type errors already fail the build — but without this step a red test
      # suite still shipped to production.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (vite build → dist/)
        run: npm run build
        env:
          # Stamped into sw.js so the deploy can be checked against this
          # commit rather than against "the server answered".
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live site is serving THIS commit
        # A 200 from sw.js only proves something is being served. A stale CDN
        # answers 200 with last month's app, so the check has to be for the
        # commit: sw.js carries the SHA it was built from.
        # Polls for up to ~5 minutes (10 x 30 s) to allow CDN propagation.
        run: |
          URL="https://lilshaum.github.io/study-app/sw.js"
          for i in $(seq 1 10); do
            if curl -fsS "$URL" | grep -q "${{ github.sha }}"; then
              echo "✓ $URL is serving ${{ github.sha }} (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not yet serving this commit — waiting 30 s…"
            sleep 30
          done
          echo "::error::deploy reported success but $URL is not serving ${{ github.sha }}"
          exit 1
