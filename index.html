<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Your own lecture notes, turned into practice questions, flashcards and a plan for each day before the exam." />
  <!-- The card a shared link shows in Messages, Discord and the like. The
       image needs a full address; update it with the URL if the app moves
       (docs/rename-plan.md). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arborous" />
  <meta property="og:title" content="Arborous" />
  <meta property="og:description" content="Your own lecture notes, turned into practice and a daily plan." />
  <meta property="og:image" content="https://lilshaum.github.io/study-app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A line drawing of a tree beside the word Arborous." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#e2e0d5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Arborous" />
  <title>Arborous</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- iOS ignores SVG here, so this must point at a raster icon or the
       home-screen tile falls back to a screenshot of the page. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <script>
    // Pre-hydration theme stamp — avoids a flash of the wrong theme/tree on
    // load. Mirrors useThemeStore's persisted shape; kept dependency-free.
    (function () {
      try {
        var raw = localStorage.getItem('arborous:theme');
        var state = raw ? JSON.parse(raw).state : null;
        if (state && state.mode) document.documentElement.setAttribute('data-theme', state.mode);
      } catch (e) { /* localStorage unavailable — fall back to system default */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
