<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Banyan: wide flat canopy + hanging aerial roots -->
  <!-- Wide flat canopy (much wider than tall) -->
  <ellipse cx="12" cy="7" rx="11" ry="4.5" fill="currentColor"/>
  <!-- Central trunk -->
  <rect x="11" y="11" width="2" height="5" rx="1" fill="currentColor"/>
  <!-- Aerial roots — 4 hanging vertical strands -->
  <line x1="5"  y1="11" x2="5"  y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="9"  y1="11" x2="9"  y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="11" x2="15" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="11" x2="19" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
